<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 88" width="880" height="88" role="img" aria-label="Also in the toolbox, beyond what the four project cards above already show: Rust, PHP, systemd, GitHub Actions, goreleaser and golangci-lint." font-family="ConsolasFallback,ui-monospace,SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace">
<title>Also in the toolbox</title>
<style>@font-face{src:local('Consolas'),local('Consolas Bold');font-family:'ConsolasFallback';font-display:swap;size-adjust:109%}@media (max-width:500px){.sm{font-size:17px}}</style>
<defs>
 <filter id="glow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
  <feGaussianBlur stdDeviation="1.7" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity="0.30"/></pattern>
 <radialGradient id="vig" gradientUnits="userSpaceOnUse" cx="440.0" cy="40" r="528"
   gradientTransform="translate(0,40) scale(1,0.2200) translate(0,-40)">
  <stop offset="55%" stop-color="#000" stop-opacity="0"/>
  <stop offset="118%" stop-color="#2A1A06" stop-opacity="0.72"/></radialGradient>
 <clipPath id="scr"><rect width="880" height="88" rx="10"/></clipPath>
</defs>
<g clip-path="url(#scr)">
<rect width="880" height="88" fill="#0F0B06"/>
<rect width="880" height="26" fill="#181008"/>
<text x="16" y="18" xml:space="preserve" font-size="12" fill="#D59D53">jumpcodefrog@moscow:~$ </text>
<text x="182" y="18" xml:space="preserve" font-size="12" fill="#E8A33D" filter="url(#glow)">stack --installed --diff-from-cards</text>
<g filter="url(#glow)">
<rect x="26" y="40" width="47" height="19" rx="3" fill="none" stroke="#D59D53" stroke-width="1" opacity="0.75"/>
<text class="sm" x="34" y="54" xml:space="preserve" font-size="13" fill="#E8A33D">Rust</text>
<rect x="81" y="40" width="39" height="19" rx="3" fill="none" stroke="#D59D53" stroke-width="1" opacity="0.75"/>
<text class="sm" x="89" y="54" xml:space="preserve" font-size="13" fill="#E8A33D">PHP</text>
<rect x="128" y="40" width="70" height="19" rx="3" fill="none" stroke="#D59D53" stroke-width="1" opacity="0.75"/>
<text class="sm" x="136" y="54" xml:space="preserve" font-size="13" fill="#E8A33D">systemd</text>
<rect x="206" y="40" width="125" height="19" rx="3" fill="none" stroke="#D59D53" stroke-width="1" opacity="0.75"/>
<text class="sm" x="214" y="54" xml:space="preserve" font-size="13" fill="#E8A33D">GitHub Actions</text>
<rect x="339" y="40" width="94" height="19" rx="3" fill="none" stroke="#D59D53" stroke-width="1" opacity="0.75"/>
<text class="sm" x="347" y="54" xml:space="preserve" font-size="13" fill="#E8A33D">goreleaser</text>
<rect x="440" y="40" width="117" height="19" rx="3" fill="none" stroke="#D59D53" stroke-width="1" opacity="0.75"/>
<text class="sm" x="448" y="54" xml:space="preserve" font-size="13" fill="#E8A33D">golangci-lint</text>
</g>
<text x="26" y="78" xml:space="preserve" font-size="11" fill="#D59D53">the rest — Go, C++20, Python, Linux, PostgreSQL, SQLite, Redis, Docker — is on the cards above</text>
<rect width="880" height="88" fill="url(#scan)"/>
<rect width="880" height="88" fill="url(#vig)"/>
<circle cx="0" cy="0" r="30" fill="#000" opacity="0.30"/>
<circle cx="880" cy="0" r="30" fill="#000" opacity="0.30"/>
<circle cx="0" cy="88" r="30" fill="#000" opacity="0.30"/>
<circle cx="880" cy="88" r="30" fill="#000" opacity="0.30"/>
<rect x="0.5" y="0.5" width="879" height="87" rx="10" fill="none" stroke="#D59D53" stroke-width="1" opacity="0.45"/>
</g>
</svg>