<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="Thomas Rosenstein - terminal boot banner">
<title>Thomas Rosenstein - terminal boot banner</title>
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00FF41" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#00FF41" stop-opacity="0.05"/>
  </linearGradient>
  <clipPath id="card"><rect x="0" y="0" width="880" height="180" rx="8"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="880" height="180" fill="#0D1117"/>
<rect x="0" y="0" width="4" height="180" fill="#00FF41"/>
<rect x="0" y="0" width="880" height="30" fill="#161B22"/>
<circle cx="26" cy="15" r="6" fill="#FF5F56"/>
<circle cx="46" cy="15" r="6" fill="#FFBD2E"/>
<circle cx="66" cy="15" r="6" fill="#27C93F"/>
<text x="440.0" y="19" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11" fill="#7D8590">thomas@moscow &#8212; zsh</text>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.00s" fill="freeze"/><text x="30" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" fill="#00FF41">$ uname -srm</text><text x="330" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" fill="#E6EDF3">Linux 6.17.0 x86_64</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.10s" fill="freeze"/><text x="30" y="87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" fill="#00FF41">$ cat /proc/self/comm</text><text x="330" y="87" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" fill="#E6EDF3">uring-kv</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="2.20s" fill="freeze"/><text x="30" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" fill="#00FF41">$ ./bench --pipeline 32</text><text x="330" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" fill="#E6EDF3">181,553 req/s</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="3.30s" fill="freeze"/><text x="30" y="145" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" fill="#00FF41">$ echo $ROLE</text><text x="330" y="145" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" fill="#E6EDF3">Go &#38; C++ engineer</text></g>
<rect x="30" y="162" width="9" height="16" fill="#00FF41" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.1s" begin="4.40s" fill="freeze"/><animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="4.50s" repeatCount="indefinite"/></rect>
<text x="850" y="162" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="22" font-weight="600" fill="#E6EDF3">Thomas Rosenstein</text>
</g>
</svg>
