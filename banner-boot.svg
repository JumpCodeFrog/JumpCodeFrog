<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180" role="img" aria-label="Thomas Rosenstein — Go and C++ engineer, HFT, DevOps, Moscow. A terminal showing uname, the uring-kv process, a benchmark result of 181,553 requests per second, and the role line." font-family="ConsolasFallback,ui-monospace,SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace">
<title>Thomas Rosenstein — Go &amp; C++ engineer</title>
<style>@font-face{src:local('Consolas'),local('Consolas Bold');font-family:'ConsolasFallback';font-display:swap;size-adjust:109%}@keyframes rise{from{opacity:0}to{opacity:1}}.ln{opacity:1}@media (prefers-reduced-motion: no-preference){.ln{opacity:0;animation:rise .25s ease-out forwards}.l0{animation-delay:0.00s}.l1{animation-delay:1.05s}.l2{animation-delay:2.10s}.l3{animation-delay:3.15s}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{opacity:1}@media (prefers-reduced-motion: no-preference){.cur{animation:blink 1.2s steps(1,end) infinite}}</style>
<defs>
 <filter id="glow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
  <feGaussianBlur stdDeviation="1.7" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity="0.30"/></pattern>
 <radialGradient id="vig" gradientUnits="userSpaceOnUse" cx="440.0" cy="83" r="528"
   gradientTransform="translate(0,83) scale(1,0.4500) translate(0,-83)">
  <stop offset="55%" stop-color="#000" stop-opacity="0"/>
  <stop offset="118%" stop-color="#2A1A06" stop-opacity="0.72"/></radialGradient>
 <clipPath id="scr"><rect width="880" height="180" rx="10"/></clipPath>
</defs>
<g clip-path="url(#scr)">
<rect width="880" height="180" fill="#0F0B06"/>
<rect width="880" height="30" fill="#181008"/>
<circle cx="26" cy="15" r="6" fill="#FF5F56"/>
<circle cx="46" cy="15" r="6" fill="#FFBD2E"/>
<circle cx="66" cy="15" r="6" fill="#27C93F"/>
<text x="440.0" y="19" text-anchor="middle" font-size="11" fill="#D59D53">thomas@moscow — zsh</text>
<g filter="url(#glow)">
<g class="ln l0"><text x="30" y="60" font-size="14" fill="#FFB000">$ uname -srm</text><text x="330" y="60" font-size="14" fill="#FFE0B0">Linux 6.17.0 x86_64</text></g>
<g class="ln l1"><text x="30" y="88" font-size="14" fill="#FFB000">$ cat /proc/self/comm</text><text x="330" y="88" font-size="14" fill="#FFE0B0">uring-kv</text></g>
<g class="ln l2"><text x="30" y="116" font-size="14" fill="#FFB000">$ ./bench --pipeline 32</text><text x="330" y="116" font-size="14" fill="#FFE0B0">181,553 req/s</text></g>
<g class="ln l3"><text x="30" y="144" font-size="14" fill="#FFB000">$ echo $ROLE</text><text x="330" y="144" font-size="14" fill="#FFE0B0">Go &amp; C++ engineer</text></g>
<text x="850" y="160" text-anchor="end" font-size="22" font-weight="600" fill="#FFE0B0">Thomas Rosenstein</text>
</g>
<text x="850" y="140" text-anchor="end" font-size="11" fill="#D59D53" letter-spacing="2">GO · C++ · HFT · DEVOPS · MOSCOW</text>
<rect class="cur" x="30" y="160" width="9" height="16" fill="#FFB000"/>
<rect width="880" height="180" fill="url(#scan)"/>
<rect width="880" height="180" fill="url(#vig)"/>
<circle cx="0" cy="0" r="30" fill="#000" opacity="0.30"/>
<circle cx="880" cy="0" r="30" fill="#000" opacity="0.30"/>
<circle cx="0" cy="180" r="30" fill="#000" opacity="0.30"/>
<circle cx="880" cy="180" r="30" fill="#000" opacity="0.30"/>
<rect x="0.5" y="0.5" width="879" height="179" rx="10" fill="none" stroke="#D59D53" stroke-width="1" opacity="0.45"/>
</g>
</svg>