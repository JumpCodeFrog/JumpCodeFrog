<g filter="url(#glow)">
<text class="sm" x="560" y="62" xml:space="preserve" font-size="19" font-weight="600" fill="#FFB000">go-market-watcher</text>
<text class="sm" x="560" y="88" xml:space="preserve" font-size="13" font-weight="400" fill="#FFE0B0">CLI price watcher</text>
<text class="sm" x="560" y="122" xml:space="preserve" font-size="13" font-weight="400" fill="#E8A33D">lang     Go 1.25</text>
