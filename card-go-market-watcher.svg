<text x="182" y="18" xml:space="preserve" font-size="12" fill="#E8A33D" filter="url(#glow)">go-market-watcher --watch</text>
<text x="864" y="18" text-anchor="end" font-size="11" fill="#D59D53">MIT · Go 1.25</text>
