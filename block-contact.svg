<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 124" width="880" height="124" role="img" aria-label="Contact: Telegram at thomasrosenstain, email thomasrosenstain at gmail dot com. Issues and pull requests on any public repository get read." font-family="ConsolasFallback,ui-monospace,SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace">
<title>Contact</title>
<style>@font-face{src:local('Consolas'),local('Consolas Bold');font-family:'ConsolasFallback';font-display:swap;size-adjust:109%}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{opacity:1}@media (prefers-reduced-motion: no-preference){.cur{animation:blink 1.2s steps(1,end) infinite}}</style>
<defs>
 <filter id="glow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
  <feGaussianBlur stdDeviation="1.7" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1" fill="#000" opacity="0.30"/></pattern>
 <radialGradient id="vig" gradientUnits="userSpaceOnUse" cx="440.0" cy="57" r="528"
   gradientTransform="translate(0,57) scale(1,0.3100) translate(0,-57)">
  <stop offset="55%" stop-color="#000" stop-opacity="0"/>
  <stop offset="118%" stop-color="#2A1A06" stop-opacity="0.72"/></radialGradient>
 <clipPath id="scr"><rect width="880" height="124" rx="10"/></clipPath>
</defs>
<g clip-path="url(#scr)">
<rect width="880" height="124" fill="#0F0B06"/>
<rect width="880" height="26" fill="#181008"/>
<text x="16" y="18" xml:space="preserve" font-size="12" fill="#D59D53">jumpcodefrog@moscow:~$ </text>
<text x="182" y="18" xml:space="preserve" font-size="12" fill="#E8A33D" filter="url(#glow)">contact --open</text>
<g filter="url(#glow)">
<text x="26" y="62" xml:space="preserve" font-size="15" fill="#E8A33D">telegram   </text>
<text x="125" y="62" xml:space="preserve" font-size="15" fill="#FFB000">@thomasrosenstain</text>
<text x="26" y="86" xml:space="preserve" font-size="15" fill="#E8A33D">email      </text>
<text x="125" y="86" xml:space="preserve" font-size="15" fill="#FFB000">thomasrosenstain@gmail.com</text>
</g>
<rect class="cur" x="365" y="74" width="8" height="15" fill="#FFB000"/>
<text x="26" y="110" xml:space="preserve" font-size="11" fill="#D59D53">issues and pull requests on any public repository get read · so does a cold message with code attached</text>
<rect width="880" height="124" fill="url(#scan)"/>
<rect width="880" height="124" fill="url(#vig)"/>
<circle cx="0" cy="0" r="30" fill="#000" opacity="0.30"/>
<circle cx="880" cy="0" r="30" fill="#000" opacity="0.30"/>
<circle cx="0" cy="124" r="30" fill="#000" opacity="0.30"/>
<circle cx="880" cy="124" r="30" fill="#000" opacity="0.30"/>
<rect x="0.5" y="0.5" width="879" height="123" rx="10" fill="none" stroke="#D59D53" stroke-width="1" opacity="0.45"/>
</g>
</svg>