<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 132" width="880" height="132" role="img" aria-label="Contact Thomas Rosenstein on Telegram at thomasrosenstain or by email at thomasrosenstain at gmail dot com. Issues and pull requests on public repositories get read." font-family="ConsolasFallback,ui-monospace,SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace">
<title>Contact Thomas Rosenstein</title>
<style>@font-face{src:local('Consolas'),local('DejaVu Sans Mono');font-family:ConsolasFallback;font-display:swap;size-adjust:105%}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{opacity:1}@media(prefers-reduced-motion:no-preference){.cursor{animation:blink 1.2s steps(1,end) infinite}}</style>
<defs><filter id="g" x="-25%" y="-70%" width="150%" height="240%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".3"/></pattern><radialGradient id="v"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".64"/></radialGradient></defs>
<rect width="880" height="132" fill="#0D0804"/>
<rect x=".5" y=".5" width="879" height="131" fill="none" stroke="#8E5F1C"/>
<text x="22" y="28" font-size="10" fill="#FFB000">$ contact --open</text>
<text x="22" y="63" font-size="13" fill="#FFE2AE" filter="url(#g)">telegram   @thomasrosenstain</text>
<text x="22" y="88" font-size="13" fill="#FFE2AE" filter="url(#g)">email      thomasrosenstain@gmail.com</text>
<text x="474" y="63" font-size="10.5" fill="#D59D53">issues and pull requests on public repositories</text>
<text x="474" y="87" font-size="10.5" fill="#D59D53">get read. source is the preferred introduction.</text>
<text x="474" y="112" font-size="10" fill="#FFB000">$ open channel</text><rect class="cursor" x="580" y="102" width="7" height="12" fill="#FFB000"/>
<rect width="880" height="132" fill="url(#s)"/><rect width="880" height="132" fill="url(#v)"/>
</svg>
