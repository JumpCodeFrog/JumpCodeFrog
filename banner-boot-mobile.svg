<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 430" width="430" height="430" role="img" aria-label="Thomas Rosenstein — Go and C++ systems engineer in Moscow, focused on low-latency backends, Linux and kernel-side I/O." font-family="ConsolasFallback,ui-monospace,SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace">
<title>Thomas Rosenstein — systems engineer</title>
<style>@font-face{src:local('Consolas'),local('DejaVu Sans Mono');font-family:ConsolasFallback;font-display:swap;size-adjust:105%}@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.boot,.cursor{opacity:1}@media(prefers-reduced-motion:no-preference){.boot{opacity:0;animation:rise .28s ease-out forwards}.b1{animation-delay:.1s}.b2{animation-delay:.34s}.b3{animation-delay:.58s}.cursor{animation:blink 1.2s steps(1,end) infinite}}</style>
