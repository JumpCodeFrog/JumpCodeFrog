<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="uring-kv — async TCP key-value server on io_uring. C++20, CMake and liburing for Linux 5.10 and later. accept, recv and send use the ring; no epoll and no blocking syscall on the hot path." font-family="ConsolasFallback,ui-monospace,SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace">
<title>uring-kv — featured systems project</title>
<style>
@font-face{src:local('Consolas'),local('DejaVu Sans Mono');font-family:ConsolasFallback;font-display:swap;size-adjust:105%}
@keyframes packet{0%,18%{opacity:.18}24%,54%{opacity:1}66%,100%{opacity:.18}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.packet{opacity:1}.p2{animation-delay:.28s}.p3{animation-delay:.56s}.p4{animation-delay:.84s}.cursor{opacity:1}
@media (prefers-reduced-motion:no-preference){.packet{animation:packet 2.8s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1,end) infinite}}
text[fill="#765126"]{fill:#A67637}text[fill="#8C6531"]{fill:#B47F40}
</style>
<defs>
<filter id="glow" x="-25%" y="-50%" width="150%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".30"/></pattern>
<radialGradient id="vig" cx="50%" cy="45%" r="76%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".65"/></radialGradient>
<clipPath id="frame"><rect width="880" height="380" rx="4"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="880" height="380" fill="#0D0804"/>
<rect width="880" height="31" fill="#1A1007"/>
<text x="18" y="20" font-size="10.5" fill="#A67637">jumpcodefrog@linux:~/public$ ./uring_kv 127.0.0.1 7777</text>
<text x="860" y="20" text-anchor="end" font-size="9.5" fill="#765126">MIT · C++20 · LINUX 5.10+</text>

<text x="27" y="83" font-size="31" font-weight="700" fill="#FFB000" filter="url(#glow)">uring-kv</text>
<text x="27" y="111" font-size="12.5" fill="#FFE2AE">async TCP key-value server on io_uring</text>
<text x="27" y="153" font-size="11" fill="#D59D53">accept / recv / send submitted through the ring.</text>
<text x="27" y="176" font-size="11" fill="#D59D53">no epoll. no blocking syscall on the hot path.</text>
<text x="27" y="218" font-size="10.5" fill="#8C6531">lang       C++20</text>
<text x="27" y="240" font-size="10.5" fill="#8C6531">build      CMake + liburing</text>
<text x="27" y="262" font-size="10.5" fill="#8C6531">target     Linux 5.10+</text>
<text x="27" y="284" font-size="10.5" fill="#8C6531">model      single event loop</text>
<text x="27" y="306" font-size="10.5" fill="#8C6531">licence    MIT</text>

<g transform="translate(474 58)">
<text x="0" y="0" font-size="9" fill="#765126">SUBMISSION QUEUE</text>
