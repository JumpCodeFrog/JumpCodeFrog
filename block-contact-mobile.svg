<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 205" width="430" height="205" role="img" aria-label="Contact Thomas Rosenstein on Telegram at JumpCodeFrog or by email at thomasrosenstain at gmail dot com. Public repository issues and pull requests get read." font-family="ConsolasFallback,ui-monospace,SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace">
<title>Contact Thomas Rosenstein</title>
<style>@font-face{src:local('Consolas'),local('DejaVu Sans Mono');font-family:ConsolasFallback;font-display:swap;size-adjust:105%}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{opacity:1}@media(prefers-reduced-motion:no-preference){.cursor{animation:blink 1.2s steps(1,end) infinite}}</style>
<defs><filter id="g" x="-25%" y="-70%" width="150%" height="240%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".3"/></pattern><radialGradient id="v"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".64"/></radialGradient></defs>
<rect width="430" height="205" rx="4" fill="#0D0804"/>
<rect x=".5" y=".5" width="429" height="204" rx="4" fill="none" stroke="#8E5F1C"/>
<text x="18" y="30" font-size="16" fill="#FFB000">$ contact --open</text>
<text x="18" y="68" font-size="17" fill="#FFE2AE" filter="url(#g)">telegram  @JumpCodeFrog</text>
<text x="18" y="100" font-size="15.5" fill="#FFE2AE" filter="url(#g)">email     thomasrosenstain@gmail.com</text>
<path d="M18 120H412" stroke="#684517"/>
<text x="18" y="148" font-size="15" fill="#D59D53">issues and pull requests get read.</text>
<text x="18" y="172" font-size="15" fill="#D59D53">source is the preferred introduction.</text>
<text x="18" y="195" font-size="14" fill="#FFB000">$ open channel</text><rect class="cursor" x="145" y="184" width="7" height="11" fill="#FFB000"/>
<rect width="430" height="205" rx="4" fill="url(#s)"/><rect width="430" height="205" rx="4" fill="url(#v)"/>
</svg>
