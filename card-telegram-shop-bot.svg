<text x="20" y="67" font-size="22" font-weight="700" fill="#FFE2AE" filter="url(#g)">telegram-shop-bot</text>
<text x="20" y="92" font-size="10.5" fill="#D59D53">open-source Telegram storefront</text>
<text x="20" y="130" font-size="9.5" fill="#8C6531">binary     static · CGO off</text>
<text x="20" y="151" font-size="9.5" fill="#8C6531">storage    embedded SQLite</text>
<text x="20" y="172" font-size="9.5" fill="#8C6531">payments   Telegram Stars</text>
