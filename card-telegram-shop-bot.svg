<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 225" width="430" height="225" role="img" aria-label="telegram-shop-bot — open-source Telegram storefront in Go. Static binary with CGO disabled, embedded SQLite and Telegram Stars payments." font-family="ConsolasFallback,ui-monospace,SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace">
<title>telegram-shop-bot</title>
<style>@font-face{src:local('Consolas'),local('DejaVu Sans Mono');font-family:ConsolasFallback;font-display:swap;size-adjust:105%}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{opacity:1}@media(prefers-reduced-motion:no-preference){.cursor{animation:blink 1.2s steps(1,end) infinite}}</style>
<style>text[fill="#765126"]{fill:#A67637}text[fill="#8C6531"]{fill:#B47F40}</style>
<defs><filter id="g" x="-25%" y="-50%" width="150%" height="200%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".3"/></pattern><radialGradient id="v"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".64"/></radialGradient></defs>
