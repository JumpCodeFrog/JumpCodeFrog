# .github/workflows/metrics.yml
#
# Static profile statistics for JumpCodeFrog/JumpCodeFrog.
# Renders SVG cards with lowlighter/metrics and commits them to the default
# branch, so README.md has zero runtime dependency on third-party stat services.
#
# Verified against lowlighter/metrics on 2026-07-26:
#   - latest release tag ......... v3.34 (published 2023-09-13)
#   - action ref used ............ 65836723097537a54cd8eb90f61839426b4266b6 (v3.34)
#   - default output_action ...... commit
#   - default committer_token .... ${{ github.token }}
#   - default committer_branch ... repository default branch
#   - languages source ............ public REST /users/{user}/repos + /languages
#   - theme/dark-mode input ...... DOES NOT EXIST. Only extras_css. See note below.
#
# Coexistence with the existing .github/workflows/snake.yml:
#   snake.yml publishes to the 'output' branch; this workflow commits to the
#   default branch. Different branches, different files, different schedules.
#   The commit here is made with GITHUB_TOKEN, and GitHub does not trigger new
#   workflow runs from GITHUB_TOKEN pushes, so this cannot start a snake run
#   or a loop back into itself.

name: Metrics

on:
  # Public profile metrics intentionally use only the ephemeral repository-
  # scoped GITHUB_TOKEN. No user PAT or long-lived account credential is used.
  # Run 33769875912 verified this mode with 19 repositories and 13 languages.
  # Scheduled runs on 2026-09-02 and 2026-09-03 failed with HTTP 401 because
  # an invalid METRICS_TOKEN still overrode the working GITHUB_TOKEN fallback.
  # That user secret has since been removed.
  schedule:
    # 04:37 UTC daily. Off the top of the hour: GitHub delays scheduled jobs
    # that pile up at :00. Staggered against snake.yml's cron.
    - cron: "37 4 * * *"
  workflow_dispatch:

# GITHUB_TOKEN reads public account data and commits the generated SVGs.
permissions:
  contents: write

# Two runs pushing to the default branch at once would fail on non-fast-forward.
concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    # Never burn a fork's Actions minutes or push to a fork's default branch.
    if: github.repository == 'JumpCodeFrog/JumpCodeFrog'
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate GitHub token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api graphql --silent -f query='query { viewer { login } }'

      # ---------------------------------------------------------------------
      # 1. Overview / stats card  ->  metrics-overview.svg
      #    Replaces github-readme-stats: commits, PRs, issues, stars, followers.
      # ---------------------------------------------------------------------
      - name: Overview card
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # The public portfolio deliberately excludes private-repository data.
          # A short-lived, repository-scoped GITHUB_TOKEN is sufficient and
          # avoids exposing a long-lived user credential to an Action runner.
          token: ${{ secrets.GITHUB_TOKEN }}
          user: JumpCodeFrog
          filename: metrics-overview.svg

          template: classic
          base: header, activity, community, repositories
          # Explicit rather than relying on action defaults.
          output_action: none
          # Extra API calls, but makes total commits / PRs / PR reviews /
          # repos-contributed-to accurate instead of first-page estimates.
          base_indepth: yes

          config_output: svg
          config_timezone: Europe/Moscow

          # Raw Terminal is intentionally a fixed dark substrate. The cards
          # remain legible in both GitHub themes because the background and
          # foreground travel together inside the generated SVG.
          extras_css: |
            svg { background: #0D0804 !important; color: #D59D53 !important; }
            h1, h2, h3 { color: #FFB000 !important; }
            .title, .subtitle { color: #FFE2AE !important; }
            .field svg { fill: #8C6531 !important; }
            small { color: #A67637 !important; }
            rect.day[fill="#ebedf0"] { fill: #2F1F0E !important; }
            rect.day[fill="#9be9a8"] { fill: #6B4718 !important; }
            rect.day[fill="#40c463"] { fill: #A96817 !important; }
            rect.day[fill="#30a14e"] { fill: #D58B1E !important; }
            rect.day[fill="#216e39"] { fill: #FFB000 !important; }

      # ---------------------------------------------------------------------
      # 2. Public languages card -> metrics-languages.svg
      #    Uses only GitHub's public REST endpoints through GITHUB_TOKEN.
      # ---------------------------------------------------------------------
      - name: Install overview card
        run: sudo cat /metrics_renders/metrics-overview.svg > metrics-overview.svg

      - name: Test language generator
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Generate languages card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_languages.py

      - name: Validate generated SVGs
        run: python3 -c "import xml.etree.ElementTree as ET; [ET.parse(path) for path in ('metrics-overview.svg', 'metrics-languages.svg')]"

      - name: Commit cards
        run: |
          if git diff --quiet -- metrics-overview.svg metrics-languages.svg; then
            echo "Metrics unchanged"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add metrics-overview.svg metrics-languages.svg
          git commit -m "Update profile metrics - [Skip GitHub Action]"
          git push origin HEAD:main
