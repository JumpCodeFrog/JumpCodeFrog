<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 225" width="430" height="225" role="img" aria-label="aipf — API Proxy Forensics Toolkit. Async Python CLI that probes model lists, streaming, retry behavior, wrapper leaks and provider identity." font-family="ConsolasFallback,ui-monospace,SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace">
<title>aipf — API Proxy Forensics Toolkit</title>
<style>@font-face{src:local('Consolas'),local('DejaVu Sans Mono');font-family:ConsolasFallback;font-display:swap;size-adjust:105%}@keyframes probe{0%,18%{opacity:.25}28%,58%{opacity:1}72%,100%{opacity:.25}}.p{opacity:1}.p2{animation-delay:.35s}.p3{animation-delay:.7s}.p4{animation-delay:1.05s}@media(prefers-reduced-motion:no-preference){.p{animation:probe 2.8s ease-in-out infinite}}</style>
<defs><filter id="g" x="-25%" y="-50%" width="150%" height="200%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".3"/></pattern><radialGradient id="v"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".64"/></radialGradient></defs>
<rect width="430" height="225" fill="#0D0804"/>
<rect width="430" height="28" fill="#1A1007"/>
