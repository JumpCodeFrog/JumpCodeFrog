<text x="20" y="67" font-size="22" font-weight="700" fill="#FFE2AE" filter="url(#g)">aipf</text>
<text x="20" y="92" font-size="10.5" fill="#D59D53">API Proxy Forensics Toolkit</text>
<text x="20" y="130" font-size="9.5" fill="#8C6531">probe      model list · streaming</text>
<text x="20" y="151" font-size="9.5" fill="#8C6531">detect     retries · wrapper leaks</text>
<text x="20" y="172" font-size="9.5" fill="#8C6531">surface    async CLI · no server</text>
